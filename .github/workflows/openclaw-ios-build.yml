name: Build iOS (SideStore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Setup iOS signing
        run: ./scripts/ios-configure-signing.sh

      - name: Generate Xcode project
        run: |
          cd apps/ios
          xcodegen generate

      - name: Build iOS (Unsigned IPA)
        run: |
          cd apps/ios
          xcodebuild build \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_real \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # 打包 IPA
          cd build_real/Build/Products/Release-iphoneos/
          APP_NAME=$(find . -name "*.app" -maxdepth 1 -exec basename {} \;)
          
          mkdir -p Payload
          cp -r "$APP_NAME" Payload/
          zip -r openclaw-unsigned.ipa Payload
          mv openclaw-unsigned.ipa ../../../
          
          echo "✅ IPA 已生成: openclaw-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-iOS-Unsigned
          path: openclaw-unsigned.ipa
          retention-days: 5
